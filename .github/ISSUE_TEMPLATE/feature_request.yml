name: Feature request
description: Suggest something the plugin could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to achieve, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for how the plugin could help. Optional.
  - type: input
    id: plugin-version
    attributes:
      label: PhotoPress for Lightroom Classic version
      placeholder: "1.0.0"
